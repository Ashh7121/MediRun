<!-- authentication page -->
<!-- The specific page where new users (managers/drivers) create accounts. -->
{% extends "base.html" %}

{% block content %}

<div class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-md">

        <div class="flex justify-center mb-6">
            <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                </svg>
            </div>
        </div>

        <h1 class="text-2xl font-bold text-center text-gray-900 mb-1">MediRun</h1>
        <p class="text-sm text-center text-gray-400 mb-8">Secure Terminal Access</p>

        <form method="POST" action="/signup" class="space-y-5">

            <div class="flex gap-3">
                <div class="flex-1">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-widest mb-2">
                        First Name
                    </label>
                    <input type="text" name="first_name" placeholder="Sophie"
                        class="w-full bg-slate-100 rounded-lg px-4 py-3 text-sm text-gray-800 outline-none focus:ring-2 focus:ring-blue-500"/>
                </div>
                <div class="flex-1">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-widest mb-2">
                        Last Name
                    </label>
                    <input type="text" name="last_name" placeholder="Dupont"
                        class="w-full bg-slate-100 rounded-lg px-4 py-3 text-sm text-gray-800 outline-none focus:ring-2 focus:ring-blue-500"/>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-widest mb-2">
                    Email
                </label>
                <input type="email" name="email" placeholder="sophie@medirun.fr"
                    class="w-full bg-slate-100 rounded-lg px-4 py-3 text-sm text-gray-800 outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-widest mb-2">
                    Access Key
                </label>
                <input type="password" name="password" placeholder="••••••••••••"
                    class="w-full bg-slate-100 rounded-lg px-4 py-3 text-sm text-gray-800 outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            {% if error %}
            <p class="text-red-500 text-sm text-center">{{ error }}</p>
            {% endif %}

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3 rounded-xl transition text-sm">
                Create Account
            </button>

        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            Have an account?
            <a href="/login" class="text-blue-600 font-medium hover:underline">Sign in</a>
        </p>

        <p class="text-center text-xs text-gray-300 mt-4">
            Authorized Personnel Only • MediRun Systems
        </p>

    </div>
</div>

{% endblock %}
